workflows:
  unisomav-android:
    name: Unisom.AV Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Prepare Android project
        script: |
          set -e
          rm -rf "$CM_BUILD_DIR/unisomav_project"
          mkdir -p "$CM_BUILD_DIR/unisomav_project"
          unzip -q "$CM_BUILD_DIR/UnisomAV_Android_Project_GitHub.zip" -d "$CM_BUILD_DIR/unisomav_project"

          PROJECT_DIR="$CM_BUILD_DIR/unisomav_project/UnisomAV_Android_v1"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Build debug APK
        script: |
          set -e
          PROJECT_DIR="$CM_BUILD_DIR/unisomav_project/UnisomAV_Android_v1"
          cd "$PROJECT_DIR"
          /Users/builder/programs/gradle-8.14.1/bin/gradle assembleDebug --no-daemon

    artifacts:
      - unisomav_project/UnisomAV_Android_v1/app/build/outputs/**/*.apk
